<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>الشروط</title><style>body{max-width:760px;margin:60px auto;padding:0 20px;font:18px/1.9 Tahoma,Arial;background:#071617;color:#eee}a{color:#8fd5d1}</style><h1>شروط الاستخدام</h1><p>المعلومات هنا للإرشاد العام وقد تتغير أسعار التذاكر وساعات الدخول أو ترتيبات الوصول. تحقّق من الجهة الرسمية قبل السفر أو الشراء.</p><p>هذا الموقع غير رسمي ولا يمثل إدارة مغارة هرقل أو وزارة الثقافة المغربية.</p><p><a href="/">العودة إلى الصفحة الرئيسية</a></p></html>
